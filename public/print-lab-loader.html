<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrintLab – טוען</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f7fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .printer {
    position: relative;
    width: 460px;
    height: 350px;
    background: #fff;
    border: 3px solid #10426B;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(16,66,107,0.15);
  }

  .printer-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: #10426B;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
  }
  .printer-top .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
  }

  .rail {
    position: absolute;
    top: 28px;
    bottom: 26px;
    width: 10px;
    background: #c8d8e8;
    border: 1px solid #a0b8cc;
    border-radius: 4px;
  }
  .rail-left  { left: 12px; }
  .rail-right { right: 12px; }

  .build-plate {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 26px;
    background: #10426B;
    border-top: 2px solid #0d3457;
  }
  .build-plate::before {
    content: '';
    position: absolute;
    top: 6px; left: 24px; right: 24px;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 1px;
  }

  .carriage {
    position: absolute;
    left: 22px;
    right: 22px;
    height: 16px;
    background: #10426B;
    border-radius: 4px;
    top: 237px;
    z-index: 20;
  }

  .head {
    position: absolute;
    top: -8px;
    width: 34px;
    height: 32px;
    background: #10426B;
    border-radius: 4px 4px 6px 6px;
    left: calc(100% - 34px);
  }
  .head::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 8px;
    background: #10426B;
    border-radius: 0 0 2px 2px;
  }
  .nozzle-dot {
    position: absolute;
    bottom: -13px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.7);
    z-index: 25;
  }

  .layer-line {
    position: absolute;
    left: 22px;
    right: 22px;
    height: 2px;
    background: rgba(16,66,107,0.45);
    box-shadow: 0 0 5px 1px rgba(16,66,107,0.2);
    z-index: 10;
    top: 237px;
  }

  .logo-area {
    position: absolute;
    left: 32px;
    right: 32px;
    top: 98px;
    height: 139px;
    z-index: 5;
  }

  .logo-clip {
    position: absolute;
    inset: 0;
    clip-path: inset(100% 0 0 0);
  }

  .logo-clip svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .info {
    margin-top: 18px;
    text-align: center;
    direction: rtl;
  }
  .status-text {
    font-size: 14px;
    color: #10426B;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 8px;
    min-height: 20px;
  }
  .progress-track {
    width: 320px;
    height: 6px;
    background: #d8e6f0;
    border-radius: 3px;
    margin: 0 auto;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #10426B;
    border-radius: 3px;
  }
  .percent-label {
    margin-top: 6px;
    font-size: 12px;
    color: #7a9ab5;
    letter-spacing: 0.04em;
  }
</style>
</head>

<div class="info">
  <div class="status-text" id="statusText">מאתחל מדפסת…</div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="percent-label" id="percentLabel">0%</div>
</div>

<script>
(function() {
  const CARRIAGE_START_Y = 237;
  const CARRIAGE_END_Y   = 98;
  const CARRIAGE_TRAVEL  = CARRIAGE_START_Y - CARRIAGE_END_Y; // 139
  const HEAD_WIDTH = 34;
  const CARRIAGE_INNER = 460 - 44; // 416px
  const HEAD_MAX = CARRIAGE_INNER - HEAD_WIDTH; // 382px

  const BUILD_MS  = 9000;
  const HOLD_MS   = 2000;
  const CYCLE_MS  = BUILD_MS + HOLD_MS;
  const SCAN_MS   = 1600;

  const STATUSES = [
    { at: 0,    text: 'מאתחל מדפסת…' },
    { at: 0.05, text: 'מחמם נוזל הדפסה…' },
    { at: 0.15, text: 'מדפיס שכבה ראשונה…' },
    { at: 0.4,  text: 'בונה את הלוגו…' },
    { at: 0.65, text: 'מדפיס שכבה שנייה…' },
    { at: 0.88, text: 'מסיים הדפסה…' },
    { at: 0.99, text: 'הדפסה הושלמה ✓' },
  ];

  const logoClip    = document.getElementById('logoClip');
  const carriage    = document.getElementById('carriage');
  const head        = document.getElementById('head');
  const layerLine   = document.getElementById('layerLine');
  const progressFill= document.getElementById('progressFill');
  const percentLabel= document.getElementById('percentLabel');
  const statusText  = document.getElementById('statusText');

  let startTime = null;
  let lastStatusIdx = -1;

  function ease(t) {
    // slow start, slow end
    return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
  }

  function tick(now) {
    if (!startTime) startTime = now;
    const elapsed = (now - startTime) % CYCLE_MS;
    const raw = Math.min(elapsed / BUILD_MS, 1);
    const p   = ease(raw);

    // Clip: inset from top, so 100%=hidden, 0%=fully shown
    logoClip.style.clipPath = `inset(${((1 - p) * 100).toFixed(2)}% 0 0 0)`;

    // Carriage rises from CARRIAGE_START_Y to CARRIAGE_END_Y
    const cy = CARRIAGE_START_Y - p * CARRIAGE_TRAVEL;
    carriage.style.top = cy.toFixed(1) + 'px';

    // Layer glow line follows carriage
    layerLine.style.top = (cy + 8).toFixed(1) + 'px';
    layerLine.style.opacity = raw < 1 ? '1' : '0';

    // Head scans right→left→right (triangle wave)
    const st = (now % SCAN_MS) / SCAN_MS;
    const scanPos = st < 0.5 ? 1 - st * 2 : (st - 0.5) * 2;
    head.style.left = (scanPos * HEAD_MAX).toFixed(1) + 'px';

    // Progress
    const pct = Math.round(raw * 100);
    progressFill.style.width = pct + '%';
    percentLabel.textContent = pct + '%';

    // Status
    for (let i = STATUSES.length - 1; i >= 0; i--) {
      if (raw >= STATUSES[i].at) {
        if (lastStatusIdx !== i) {
          statusText.textContent = STATUSES[i].text;
          lastStatusIdx = i;
        }
        break;
      }
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
