<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintLab — טוענים...</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;}

.scene{
  position:relative;width:100%;max-width:560px;min-height:480px;
  background:#ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;padding:28px 20px 20px;
  box-shadow:0 8px 40px rgba(16,66,107,.12);border-radius:4px;
}
.bg{
  position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(16,66,107,.08) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;
}

.printer{position:relative;width:420px;height:180px;z-index:2;flex-shrink:0;margin-bottom:8px;}

.rail{position:absolute;top:0;bottom:36px;width:10px;border-radius:5px;background:linear-gradient(180deg,#1a5a8f,#10426B,#1a5a8f);box-shadow:0 0 10px rgba(16,66,107,.2);}
.rail::before{content:'';position:absolute;top:6px;left:3px;right:3px;bottom:6px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.25) 0,rgba(255,255,255,.25) 2px,transparent 2px,transparent 8px);border-radius:2px;}
.rail-l{left:6px;}.rail-r{right:6px;}
.rail-l::after,.rail-r::after{content:'';position:absolute;bottom:-8px;width:22px;height:10px;background:#10426B;border-radius:3px;box-shadow:0 2px 6px rgba(16,66,107,.35);}
.rail-l::after{left:0;}.rail-r::after{right:0;}
.top-bar{position:absolute;top:0;left:6px;right:6px;height:10px;border-radius:5px;background:linear-gradient(180deg,#2060a0,#10426B);box-shadow:0 0 14px rgba(16,66,107,.3),0 3px 6px rgba(0,0,0,.08);}
.x-rail{position:absolute;top:22px;left:16px;right:16px;height:5px;background:#d8e4f0;border-radius:3px;border:1px solid rgba(16,66,107,.12);}

.head{position:absolute;top:-16px;left:0;width:52px;height:52px;animation:head-slide 2.2s cubic-bezier(.37,0,.63,1) infinite;z-index:5;}
@keyframes head-slide{0%{transform:translateX(0);}50%{transform:translateX(320px);}100%{transform:translateX(0);}}

.tube{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:4px;height:22px;background:rgba(16,66,107,.18);border:1px solid rgba(16,66,107,.12);border-radius:2px;}
.extruder{position:absolute;top:0;left:0;right:0;height:26px;border-radius:5px 5px 2px 2px;background:linear-gradient(135deg,#2060a0,#10426B);border:1px solid rgba(16,66,107,.3);box-shadow:0 2px 8px rgba(16,66,107,.2);display:flex;align-items:center;justify-content:center;gap:4px;overflow:hidden;}
.fan{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,20,50,.3);position:relative;overflow:hidden;animation:spin .4s linear infinite;flex-shrink:0;}
.fan::before,.fan::after{content:'';position:absolute;width:100%;height:2px;background:rgba(255,255,255,.45);top:50%;left:0;transform:translateY(-50%);}
.fan::after{transform:translateY(-50%) rotate(60deg);}
.fb{position:absolute;width:100%;height:2px;background:rgba(255,255,255,.45);top:50%;left:0;transform:translateY(-50%) rotate(120deg);}
@keyframes spin{to{transform:rotate(360deg);}}
.heater{width:14px;height:12px;border-radius:2px;flex-shrink:0;background:#0d3558;animation:heat .8s ease-in-out infinite alternate;}
@keyframes heat{from{background:#0d3558;}to{background:#1a5a8f;box-shadow:0 0 8px rgba(26,90,143,.6);}}
.nozzle{position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.nb{width:7px;height:9px;background:linear-gradient(180deg,#1a5a8f,#0d3558);clip-path:polygon(12% 0%,88% 0%,100% 100%,0% 100%);}
.nt{width:3px;height:3px;background:#10426B;border-radius:0 0 50% 50%;}
.extrusion{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:2px;border-radius:1px;background:#10426B;box-shadow:0 0 5px rgba(16,66,107,.5);animation:xtrude 2.2s cubic-bezier(.37,0,.63,1) infinite;}
@keyframes xtrude{0%{height:10px;opacity:.8;}5%{height:5px;opacity:.4;}10%{height:12px;opacity:1;}90%{height:12px;opacity:1;}95%{height:5px;opacity:.4;}100%{height:10px;opacity:.8;}}
.plate{position:absolute;bottom:6px;left:16px;right:16px;height:16px;background:linear-gradient(180deg,#d8e4f0,#bfd0e6);border:1px solid rgba(16,66,107,.18);border-radius:3px;overflow:hidden;}
.plate::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(16,66,107,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(16,66,107,.15) 1px,transparent 1px);background-size:8px 8px;}

.logo-area{position:relative;z-index:2;width:420px;display:flex;flex-direction:column;align-items:center;}
.logo-clip{width:420px;overflow:hidden;animation:reveal-lr 8s ease-in-out infinite;}
@keyframes reveal-lr{0%{clip-path:inset(0 100% 0 0);}55%{clip-path:inset(0 0% 0 0);}82%{clip-path:inset(0 0% 0 0);}95%{clip-path:inset(0 0% 0 0);opacity:1;}100%{clip-path:inset(0 100% 0 0);opacity:0;}}
.logo-svg{width:420px;height:auto;display:block;}

.icon-path{stroke-dasharray:600;stroke-dashoffset:600;animation:draw-stroke 3s ease-in-out infinite;}
.icon-path.p2{animation-delay:.3s;}.icon-path.p3{animation-delay:.6s;}
.icon-line{stroke-dasharray:20;stroke-dashoffset:20;animation:draw-stroke .5s ease-in-out infinite;animation-delay:.1s;}
@keyframes draw-stroke{0%{stroke-dashoffset:600;}55%{stroke-dashoffset:0;}82%{stroke-dashoffset:0;}95%{stroke-dashoffset:0;}100%{stroke-dashoffset:600;}}

.progress-wrap{width:380px;margin-top:18px;z-index:3;direction:rtl;}
.progress-top{display:flex;justify-content:space-between;color:#10426B;font-size:10px;letter-spacing:.3px;margin-bottom:4px;opacity:.7;}
.progress-track{height:4px;background:#d8e4f0;border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#1a5a8f,#10426B);box-shadow:0 0 6px rgba(16,66,107,.4);animation:pfill 8s ease-in-out infinite;}
@keyframes pfill{0%{width:0%;}55%{width:95%;}82%{width:100%;}97%{width:100%;opacity:1;}100%{width:0%;opacity:0;}}

.status-row{display:flex;align-items:center;gap:7px;margin-top:10px;z-index:3;flex-direction:row-reverse;}
.sdot{width:6px;height:6px;border-radius:50%;background:#10426B;box-shadow:0 0 6px rgba(16,66,107,.5);animation:dpulse .9s ease-in-out infinite;}
@keyframes dpulse{0%,100%{opacity:.25;transform:scale(.7);}50%{opacity:1;transform:scale(1.2);}}
.stxt{font-size:11px;color:#10426B;opacity:.65;direction:rtl;letter-spacing:.3px;}
.spark{position:absolute;pointer-events:none;z-index:20;border-radius:50%;background:#10426B;opacity:.6;}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="bg"></div>
  <div class="printer">
    <div class="rail rail-l"></div><div class="rail rail-r"></div>
    <div class="top-bar"></div>
    <div class="x-rail">
      <div class="head" id="head">
        <div class="tube"></div>
        <div class="extruder"><div class="fan"><div class="fb"></div></div><div class="heater"></div></div>
        <div class="nozzle"><div class="nb"></div><div class="nt"></div></div>
        <div class="extrusion"></div>
      </div>
    </div>
    <div class="plate"></div>
  </div>

<script>
(function(){
  const CYCLE=8000;
  const pctEl=document.getElementById('pct');
  const stxtEl=document.getElementById('stxt');
  const scene=document.getElementById('scene');
  const head=document.getElementById('head');
  const msgs=['טוענים חדשנות ויצירתיות...','מחמם את ראש ההדפסה...','בונה שכבה אחר שכבה...','כמעט מוכן...','טוענים חדשנות ויצירתיות...'];
  let mi=0;setInterval(()=>{mi=(mi+1)%msgs.length;stxtEl.textContent=msgs[mi];},2000);
  window.addEventListener('load',()=>{
    document.querySelectorAll('.icon-path').forEach(p=>{
      try{const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;}catch(e){}
    });
  });
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function tick(){
    const t=(Date.now()%CYCLE)/CYCLE;
    let p=t<.55?ease(t/.55):t<.82?1:t<.97?1:Math.max(0,1-(t-.97)/.03);
    pctEl.textContent=Math.round(p*100)+'%';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  function spark(){
    const hr=head.getBoundingClientRect(),sr=scene.getBoundingClientRect();
    const cx=hr.left-sr.left+hr.width/2,cy=hr.bottom-sr.top+8;
    const s=document.createElement('div');s.className='spark';
    const sz=1+Math.random()*2;
    s.style.cssText='width:'+sz+'px;height:'+sz+'px;position:absolute;left:'+cx+'px;top:'+cy+'px;border-radius:50%;background:#10426B;opacity:.6;';
    scene.appendChild(s);
    const ang=(Math.random()*120+30)*Math.PI/180;
    const spd=12+Math.random()*18;
    const vx=Math.cos(ang-Math.PI/2)*spd,vy=Math.sin(ang-Math.PI/2)*spd;
    const life=350+Math.random()*300,t0=performance.now();
    function a(now){const p=(now-t0)/life;if(p>=1){s.remove();return;}s.style.left=(cx+vx*p)+'px';s.style.top=(cy+vy*p+20*p*p)+'px';s.style.opacity=.6*(1-p);requestAnimationFrame(a);}
    requestAnimationFrame(a);
  }
  setInterval(spark,110);
})();
</script>
