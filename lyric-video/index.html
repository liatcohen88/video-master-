<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הטוב הרע ועודיה</title>
<style>
  @font-face { font-family: "Suez One"; src: url("../assets/fonts/SuezOne-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Frank Ruhl Libre"; src: url("../assets/fonts/FrankRuhlLibre.ttf") format("truetype"); font-weight: 300 900; }

  :root {
    --ink: #140b07;
    --cream: #f7e8c8;
    --mustard: #e3a42c;
    --blood: #a4161a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; direction: rtl; background: #000; }
  #cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
  .scene { position: absolute; inset: 0; visibility: hidden; }
  .bg { position: absolute; inset: -160px; }
  .anchor { position: absolute; width: 0; height: 0; }
  .wrap { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); white-space: nowrap; }
  .w { font-family: "Suez One", serif; line-height: 1.12; white-space: nowrap; transform-origin: 50% 50%; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; overflow: visible; }

  /* --- scene A: הטוב --- */
  #sceneA .base { background: radial-gradient(ellipse 70% 55% at 50% 42%, #f4bb45 0%, #e3a42c 48%, #c07e18 100%); }
  .rays { position: absolute; left: 540px; top: 760px; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px; border-radius: 50%;
          background: repeating-conic-gradient(from 0deg, rgba(120, 58, 0, .15) 0deg 6deg, rgba(255, 236, 170, .07) 6deg 12deg); }
  .halftone { background-image: radial-gradient(circle, rgba(60, 24, 0, .24) 1.6px, transparent 2.2px); background-size: 11px 11px;
              mix-blend-mode: multiply; -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 45%, transparent 30%, #000 100%); }
  .paper { mix-blend-mode: multiply; opacity: .6; background-size: 100% 100%; }
  #wGood { color: var(--ink); }
  #ruleA { position: relative; width: 640px; height: 12px; background: var(--ink); }
  #ruleA::before { content: ""; position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; background: var(--ink);
                   transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 0 8px #e6a830, 0 0 0 15px var(--ink); }
  #ruleA::after { content: ""; position: absolute; top: 50%; left: -26px; right: -26px; height: 22px; transform: translateY(-50%);
                  background: radial-gradient(circle at 11px 50%, var(--ink) 10px, transparent 11px), radial-gradient(circle at calc(100% - 11px) 50%, var(--ink) 10px, transparent 11px); }

  /* --- scene B: הרע --- */
  #sceneB .base { background: radial-gradient(ellipse 70% 55% at 50% 46%, #cc2429 0%, #a4161a 50%, #5e090c 100%); }
  .rings { position: absolute; left: 540px; top: 930px; width: 3400px; height: 3400px; margin: -1700px 0 0 -1700px; border-radius: 50%;
           background: repeating-radial-gradient(circle, rgba(40, 0, 0, .2) 0 34px, rgba(40, 0, 0, 0) 34px 68px); }
  .cross { position: absolute; background: rgba(30, 0, 0, .3); }
  #wBad { color: var(--cream); }
  #badWrap { transform-origin: 100% 10%; }
  .ghost { position: absolute; left: 0; top: 0; width: 100%; text-align: center; color: transparent; opacity: 0; text-shadow: none; }
  #burnSvg { filter: drop-shadow(0 0 10px rgba(255, 130, 40, .95)) drop-shadow(0 0 34px rgba(255, 90, 20, .6)); visibility: hidden; }

  /* --- scene C: ועודיה --- */
  #sceneC .base { background: linear-gradient(to bottom, #0b0403 0%, #1a0a06 20%, #37120a 40%, #722210 58%, #c2431c 72%, #ec7c2d 81%, #f6b157 88%, #f6b157 100%); }
  #sunGlow { position: absolute; left: 540px; width: 1800px; height: 1800px; margin: -900px 0 0 -900px; border-radius: 50%;
             background: radial-gradient(circle, rgba(255, 190, 100, .6) 0%, rgba(245, 120, 46, .3) 28%, rgba(200, 60, 20, 0) 62%); mix-blend-mode: screen; }
  #sun { position: absolute; left: 540px; width: 860px; height: 860px; margin: -430px 0 0 -430px; border-radius: 50%;
         background: radial-gradient(circle at 50% 30%, #fff4d0 0%, #ffda84 24%, #f8a53d 56%, #e8692b 82%, #d24a21 100%);
         -webkit-mask-image: linear-gradient(to bottom, #000 0 57%, transparent 57% 59%, #000 59% 66%, transparent 66% 69.5%, #000 69.5% 75.5%, transparent 75.5% 80%, #000 80% 85.5%, transparent 85.5% 91%, #000 91%); }
  #wOdeya { color: #fcedcf; }
  #wOdeya .L { display: inline-block; transform-origin: 50% 90%; }
  #lockWrap { font-family: "Suez One", serif; line-height: 1.12; }
  #lockWrap span { display: inline-block; }
  #lkGood { color: #f3b63e; }
  #lkBad { color: #ee3d30; }

  /* --- screen-space film layers --- */
  #vignette, #flicker, #flash, #iris { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 82% 64% at 50% 47%, rgba(0, 0, 0, 0) 50%, rgba(14, 6, 2, .66) 100%); mix-blend-mode: multiply; }
  #flicker { background: #000; opacity: 0; }
  #flash { background: #fff6e2; opacity: 0; }
  #grain { mix-blend-mode: overlay; opacity: .42; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="filters"></defs></svg>

<div id="stage">
  <div id="cam">

    <section id="sceneA" class="scene">
      <div class="bg base"></div>
      <div class="rays" id="raysA"></div>
      <div class="bg halftone"></div>
      <div class="bg paper"></div>
      <div class="anchor" style="left:540px; top:930px"><div class="wrap"><div class="w" id="wGood">הטוב</div><div class="w ghost" id="gGood">הטוב</div></div></div>
      <div class="anchor" style="left:540px; top:1185px"><div class="wrap" id="ruleWrap"><div id="ruleA"></div></div></div>
      <div class="anchor" style="left:540px; top:560px"><svg class="wrap" id="star" width="300" height="300" viewBox="-150 -150 300 300"></svg></div>
      <svg class="layer" id="fxA" viewBox="0 0 1080 1920"></svg>
    </section>

    <section id="sceneB" class="scene">
      <div class="bg base"></div>
      <div class="rings" id="ringsB"></div>
      <div class="cross" style="left:-160px; right:-160px; top:929px; height:3px"></div>
      <div class="cross" style="top:-160px; bottom:-160px; left:539px; width:3px"></div>
      <div class="bg halftone"></div>
      <div class="bg paper"></div>
      <div class="anchor" style="left:540px; top:930px">
        <div class="wrap" id="badWrap"><div class="w" id="wBad">הרע</div><div class="w ghost" id="gBad">הרע</div><svg id="badHoles" style="position:absolute; left:0; top:0; overflow:visible"></svg></div>
      </div>
    </section>

    <section id="sceneC" class="scene">
      <div class="bg base"></div>
      <div id="sunGlow"></div>
      <div id="sun"></div>
      <svg class="layer" viewBox="0 0 1080 1920" style="overflow:visible">
        <defs>
          <linearGradient id="farG" x1="0" y1="1420" x2="0" y2="1720" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5c1c0d"/><stop offset="1" stop-color="#240a05"/>
          </linearGradient>
        </defs>
        <path fill="url(#farG)" stroke="#ff9a48" stroke-opacity=".5" stroke-width="3" stroke-linejoin="round"
              d="M-160 1590 L-160 1480 L20 1472 L52 1444 L70 1420 L300 1420 L318 1446 L346 1464 L372 1492 L420 1528 L470 1542 L520 1536 L560 1520 L600 1510 L640 1502 L664 1468 L690 1448 L704 1432 L930 1432 L948 1456 L980 1468 L1010 1488 L1060 1498 L1240 1500 L1240 2080 L-160 2080 Z"/>
        <g fill="#0b0503" stroke="#0b0503" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M-160 1700 C40 1664 240 1682 400 1676 C560 1670 700 1648 820 1658 C940 1668 1060 1652 1240 1660 L1240 2080 L-160 2080 Z"/>
          <path fill="none" stroke-width="52" d="M850 1690 L850 1454"/>
          <path fill="none" stroke-width="36" d="M850 1592 L806 1592 Q780 1592 780 1566 L780 1502"/>
          <path fill="none" stroke-width="34" d="M850 1550 L894 1550 Q920 1550 920 1524 L920 1478"/>
          <path fill="none" stroke-width="30" d="M168 1700 L168 1590"/>
          <path fill="none" stroke-width="22" d="M168 1652 L140 1652 Q126 1652 126 1638 L126 1608"/>
          <path fill="none" stroke-width="20" d="M168 1632 L192 1632 Q204 1632 204 1620 L204 1600"/>
          <ellipse stroke="none" cx="520" cy="1684" rx="74" ry="20"/>
        </g>
      </svg>
      <div class="anchor" style="left:540px; top:1010px"><div class="wrap"><div class="w" id="wOdeya"></div></div></div>
      <div class="anchor" style="left:540px; top:560px"><div class="wrap" id="lockWrap"><span id="lkGood">הטוב</span> <span id="lkBad">הרע</span></div></div>
      <svg class="layer" id="fxC" viewBox="0 0 1080 1920"></svg>
    </section>

    <svg class="layer" id="burnSvg" viewBox="0 0 1080 1920"><path id="burn" fill="none" stroke="#160602" stroke-width="15" stroke-linejoin="round"/></svg>
    <canvas id="parts" class="layer" width="1080" height="1920"></canvas>
  </div>

  <div id="vignette"></div>
  <div id="flicker"></div>
  <div id="flash"></div>
  <canvas id="grain" class="layer" width="1080" height="1920"></canvas>
  <canvas id="dirt" class="layer" width="1080" height="1920"></canvas>
  <div id="iris"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const FPS = 30;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  inQuad: x => x * x,
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBounce: x => {
    const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375;
    return n * (x -= 2.625 / d) * x + .984375;
  },
};
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function svg(tag, attrs, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

// ---------- timeline (seconds) ----------
const T = {
  iris: .26,
  goodSlam: .16,
  starDrop: .40, starLand: .60,
  rule: [.62, .84],
  starGlint: .95,
  shot0: 1.30,              // bullet through the sheriff star
  holeGrow: [1.40, 1.56],
  badSlam: 1.56,
  shots: [1.96, 2.10, 2.24],
  badSwing: 2.32, badFall: 2.48,
  cutC: 2.64,
  sunRise: [2.64, 3.74],
  letters: 2.98, letterGap: .075, letterDur: .44,
  odeyaGlint: 3.74,
  lockIn: 3.98, lockHit: 4.22,
  end: 5.2,
};
window.DURATION = T.end;
const HOLE = { x: 540, y: 560 };
const LETTERS = 'ועודיה';
const LROT = [-14, 9, -7, 12, -10, 8];

const flashes = [
  { t: T.goodSlam + .06, a: .18, d: .08 },
  { t: T.shot0, a: .5, d: .09 },
  { t: T.badSlam + .06, a: .2, d: .08 },
  ...T.shots.map(t => ({ t, a: .42, d: .07 })),
  { t: T.cutC, a: .75, d: .14 },
  { t: T.lockHit, a: .28, d: .1 },
];
const kicks = [
  { t: T.goodSlam + .08, a: 28 },
  { t: T.starLand, a: 10 },
  { t: T.shot0, a: 24 },
  { t: T.badSlam + .08, a: 34 },
  ...T.shots.map(t => ({ t, a: 17 })),
  ...[...LETTERS].map((_, i) => ({ t: T.letters + i * T.letterGap + .16, a: 5 })),
  { t: T.lockHit, a: 24 },
];

// ---------- text styling ----------
function blockShadow(depth, color, r, extra = []) {
  const s = [];
  for (let k = 0; k <= depth; k += 2) {
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2;
      s.push(`${(-k + Math.cos(a) * r).toFixed(1)}px ${(k + Math.sin(a) * r).toFixed(1)}px 0 ${color}`);
    }
  }
  return s.concat(extra).join(',');
}
function fit(el, maxW, maxPx) {
  el.style.fontSize = maxPx + 'px';
  const w = el.offsetWidth;
  if (w > maxW) el.style.fontSize = (maxPx * maxW / w).toFixed(1) + 'px';
}

// ---------- particles (closed-form so every frame is independent) ----------
const emitters = [];
function emit(kind, t0, o) { emitters.push(Object.assign({ kind, t0, seed: emitters.length * 977 + 31 }, o)); }

function drawParticles(ctx, t) {
  for (const e of emitters) {
    if (t < e.t0 || t < e.from || t >= e.to) continue;
    const r = rng(e.seed);
    for (let i = 0; i < e.n; i++) {
      const u = r(), v = r(), w = r(), q = r(), z = r();
      const life = e.life[0] + q * (e.life[1] - e.life[0]);
      const age = t - e.t0 - z * (e.stagger || 0);
      if (age < 0 || age > life) continue;
      const x0 = lerp(e.x0, e.x1, u), y0 = e.y + (v - .5) * (e.jy || 0);
      let vx, vy;
      if (e.kind === 'spark') {
        const ang = w * Math.PI * 2, sp = e.speed[0] + v * (e.speed[1] - e.speed[0]);
        vx = Math.cos(ang) * sp; vy = Math.sin(ang) * sp * .8 - 200;
      } else {
        vx = (u - .5) * 2 * e.spread + (w - .5) * e.spread * .6;
        vy = -(e.rise[0] + w * (e.rise[1] - e.rise[0]));
      }
      const k = e.drag, f = (1 - Math.exp(-k * age)) / k;
      const x = x0 + vx * f, y = y0 + vy * f + .5 * (e.g || 0) * age * age;
      const lp = age / life;
      if (e.kind === 'spark') {
        const sv = Math.exp(-k * age), dx = vx * sv * .022, dy = (vy * sv + (e.g || 0) * age) * .022;
        ctx.strokeStyle = `rgba(${e.rgb},${(1 - lp) * e.alpha})`;
        ctx.lineWidth = 2.6 * (1 - lp) + .6;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - dx, y - dy); ctx.stroke();
      } else {
        const size = e.size[0] + v * (e.size[1] - e.size[0]) + e.grow * age;
        const a = e.alpha * Math.pow(1 - lp, 1.6) * Math.min(1, age * 30);
        const g = ctx.createRadialGradient(x, y, 0, x, y, size);
        g.addColorStop(0, `rgba(${e.rgb},${a})`);
        g.addColorStop(1, `rgba(${e.rgb},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

function drawSky(ctx, t) {
  const r = rng(4242);
  for (let i = 0; i < 70; i++) {
    const x = r() * 1080, y = 60 + r() * 760, s = .8 + r() * 1.9, ph = r() * 6.28, sp = 2 + r() * 5;
    const a = (.35 + .65 * (.5 + .5 * Math.sin(t * sp + ph))) * clamp(1 - y / 900) * .9;
    ctx.fillStyle = `rgba(255,238,205,${a})`;
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
  const m = rng(777);
  for (let i = 0; i < 80; i++) {
    const bx = m() * 1300 - 110, by = 640 + m() * 900, s = 1.4 + m() * 3.6, sp = 10 + m() * 26, ph = m() * 6.28;
    const age = t - T.cutC;
    const x = ((bx + age * sp * .7 + Math.sin(age * 1.3 + ph) * 14) % 1300 + 1300) % 1300 - 110;
    const y = by - age * sp + Math.cos(age * 1.1 + ph) * 8;
    const a = (.18 + .4 * m()) * (.6 + .4 * Math.sin(age * 3 + ph)) * clamp((t - T.cutC) * 2);
    const g = ctx.createRadialGradient(x, y, 0, x, y, s * 2.2);
    g.addColorStop(0, `rgba(255,222,170,${a})`);
    g.addColorStop(1, 'rgba(255,222,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, s * 2.2, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- film layers ----------
const grainSmall = document.createElement('canvas');
grainSmall.width = 540; grainSmall.height = 960;
const gsx = grainSmall.getContext('2d');
const gimg = gsx.createImageData(540, 960);
const gbuf = new Uint32Array(gimg.data.buffer);
function drawGrain(ctx, frame) {
  let s = (Math.imul(frame + 1, 2654435761) >>> 0) || 1;
  for (let i = 0; i < gbuf.length; i++) {
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    const v = ((s & 255) + ((s >>> 8) & 255)) >>> 1;
    gbuf[i] = 0xff000000 | (v << 16) | (v << 8) | v;
  }
  gsx.putImageData(gimg, 0, 0);
  ctx.clearRect(0, 0, 1080, 1920);
  ctx.drawImage(grainSmall, 0, 0, 1080, 1920);
}
function drawDirt(ctx, frame) {
  ctx.clearRect(0, 0, 1080, 1920);
  const r = rng(frame * 7919 + 13);
  const n = Math.floor(r() * 6);
  for (let i = 0; i < n; i++) {
    const x = r() * 1080, y = r() * 1920, s = 1 + r() * 4.5, dark = r() < .78;
    ctx.fillStyle = dark ? `rgba(18,9,4,${.55 + r() * .35})` : `rgba(255,246,222,${.4 + r() * .3})`;
    for (let j = 0; j < 3; j++) { ctx.beginPath(); ctx.arc(x + (r() - .5) * s * 1.6, y + (r() - .5) * s * 1.6, s * (.4 + r() * .6), 0, Math.PI * 2); ctx.fill(); }
  }
  if (r() < .1) {
    const x = r() * 1080, y = r() * 1920, l = 30 + r() * 70;
    ctx.strokeStyle = 'rgba(18,9,4,.55)'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.bezierCurveTo(x + l * .4, y - l * .3, x + l * .6, y + l * .4, x + l, y + (r() - .5) * l); ctx.stroke();
  }
  const b = rng(Math.floor(frame / 9) * 31 + 7);
  if (b() < .55) {
    const x = b() * 1080 + (r() - .5) * 3, y0 = b() * 600, y1 = 1300 + b() * 620;
    ctx.strokeStyle = `rgba(255,240,210,${.1 + b() * .12})`; ctx.lineWidth = 1 + b() * 1.2;
    ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + (b() - .5) * 8, y1); ctx.stroke();
  }
}
function paperTexture(seed, w, h, lo) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), img = x.createImageData(w, h), r = rng(seed);
  for (let i = 0; i < w * h; i++) {
    const v = lo + r() * (255 - lo);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v * .97; img.data[i * 4 + 2] = v * .92; img.data[i * 4 + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c.toDataURL();
}

// ---------- ragged burn-hole edge ----------
const RAG = [];
{
  const r = rng(4321), k = 16, coarse = Array.from({ length: k }, () => (r() - .5) * .16);
  for (let i = 0; i < 96; i++) {
    const f = i / 96 * k, a = Math.floor(f), b = (a + 1) % k, u = f - a, s = u * u * (3 - 2 * u);
    RAG.push(1 + lerp(coarse[a], coarse[b], s) + (r() - .5) * .025);
  }
}
function ragPath(cx, cy, R) {
  let d = '';
  for (let i = 0; i < RAG.length; i++) {
    const a = i / RAG.length * Math.PI * 2, rad = R * RAG[i];
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rad).toFixed(1) + ' ' + (cy + Math.sin(a) * rad).toFixed(1);
  }
  return d + 'Z';
}

// ---------- build ----------
let star, letters = [], sparkA, sparkC, holeA, holesB = [], odeyaW = 0, mbIndex = 0;
function sparkle(parent) {
  return svg('path', { d: 'M0 -70 C9 -9 9 -9 70 0 C9 9 9 9 0 70 C-9 9 -9 9 -70 0 C-9 -9 -9 -9 0 -70 Z', fill: '#fffbe9', opacity: 0 }, parent);
}
function build() {
  // motion-blur filters (horizontal)
  const defs = $('filters');
  for (let i = 0; i <= 14; i++) {
    const f = svg('filter', { id: 'mb' + i, x: '-60%', y: '-20%', width: '220%', height: '140%' }, defs);
    svg('feGaussianBlur', { stdDeviation: `${i * 4} 0` }, f);
  }

  // sheriff star
  star = $('star');
  let d = '';
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 6, rad = i % 2 ? 60 : 112;
    d += (i ? 'L' : 'M') + (Math.cos(a) * rad).toFixed(1) + ' ' + (Math.sin(a) * rad).toFixed(1);
  }
  svg('path', { d: d + 'Z', fill: '#140b07' }, star);
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    svg('circle', { cx: Math.cos(a) * 112, cy: Math.sin(a) * 112, r: 15, fill: '#140b07' }, star);
  }
  svg('circle', { r: 44, fill: 'none', stroke: '#e6a830', 'stroke-width': 5 }, star);
  svg('circle', { r: 33, fill: 'none', stroke: '#e6a830', 'stroke-width': 2, 'stroke-dasharray': '4 6' }, star);

  // bullet hole rim + cracks on the yellow poster (scene B shows through the hole)
  const fxA = $('fxA');
  holeA = svg('g', { opacity: 0 }, fxA);
  const r = rng(99);
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2 + r() * .5, l = 30 + r() * 46;
    const x1 = Math.cos(a) * 34, y1 = Math.sin(a) * 34, x2 = Math.cos(a) * (34 + l), y2 = Math.sin(a) * (34 + l);
    const mx = (x1 + x2) / 2 + (r() - .5) * 12, my = (y1 + y2) / 2 + (r() - .5) * 12;
    const p = `M${x1.toFixed(1)} ${y1.toFixed(1)} L${mx.toFixed(1)} ${my.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}`;
    svg('path', { d: p, stroke: '#140b07', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, holeA);
    svg('path', { d: p, stroke: '#ffe9b3', 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, holeA);
  }
  svg('circle', { r: 40, fill: 'none', stroke: '#1a0d05', 'stroke-width': 10, opacity: .8 }, holeA);
  svg('circle', { r: 34, fill: 'none', stroke: '#ffe2a0', 'stroke-width': 5 }, holeA);
  sparkA = sparkle(fxA);

  // words
  const wGood = $('wGood'), wBad = $('wBad'), wOdeya = $('wOdeya');
  fit(wGood, 860, 420);
  wGood.style.textShadow = '-9px 7px 0 rgba(168, 24, 22, .55)';
  $('gGood').style.fontSize = wGood.style.fontSize;
  $('gGood').style.webkitTextStroke = '5px rgba(20, 11, 7, .75)';
  fit(wBad, 740, 560);
  wBad.style.textShadow = blockShadow(22, '#1a0505', 4, ['-34px 40px 40px rgba(0,0,0,.35)']);
  $('gBad').style.fontSize = wBad.style.fontSize;
  $('gBad').style.webkitTextStroke = '5px rgba(255, 236, 200, .8)';

  for (const ch of LETTERS) {
    const s = document.createElement('span');
    s.className = 'L'; s.textContent = ch;
    wOdeya.appendChild(s); letters.push(s);
  }
  fit(wOdeya, 900, 300);
  const odeyaShadow = blockShadow(18, '#1c0805', 6, ['-30px 40px 50px rgba(20,4,0,.5)']);
  letters.forEach(s => s.style.textShadow = odeyaShadow);
  odeyaW = wOdeya.offsetWidth;

  const lock = $('lockWrap');
  fit(lock, 760, 160);
  const lockShadow = blockShadow(12, '#160704', 4, ['-20px 26px 30px rgba(0,0,0,.45)']);
  $('lkGood').style.textShadow = lockShadow;
  $('lkBad').style.textShadow = lockShadow;

  // bullet holes in "הרע" (box-relative positions)
  const bw = wBad.offsetWidth, bh = wBad.offsetHeight, hs = $('badHoles');
  hs.setAttribute('width', bw); hs.setAttribute('height', bh);
  hs.setAttribute('viewBox', `0 0 ${bw} ${bh}`);
  [[.78, .46], [.47, .58], [.17, .4]].forEach(([fx, fy], i) => {
    const g = svg('g', { opacity: 0 }, hs);
    const rr = rng(500 + i);
    for (let j = 0; j < 8; j++) {
      const a = j / 8 * Math.PI * 2 + rr() * .6, l = 20 + rr() * 40;
      svg('path', { d: `M${(Math.cos(a) * 28).toFixed(1)} ${(Math.sin(a) * 28).toFixed(1)} L${(Math.cos(a + (rr() - .5) * .3) * (28 + l)).toFixed(1)} ${(Math.sin(a + (rr() - .5) * .3) * (28 + l)).toFixed(1)}`,
        stroke: '#1a0505', 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
    }
    svg('circle', { r: 33, fill: '#f1d9a8', opacity: .95 }, g);
    svg('circle', { r: 24, fill: '#0d0303' }, g);
    svg('circle', { r: 24, fill: 'none', stroke: '#3a0a0a', 'stroke-width': 5 }, g);
    holesB.push({ g, x: fx * bw, y: fy * bh, fx: 540 + (fx - .5) * bw, fy: 930 + (fy - .5) * bh, t: T.shots[i] });
  });
  sparkC = sparkle($('fxC'));

  // paper textures
  document.querySelectorAll('.paper').forEach((el, i) => {
    el.style.backgroundImage = `url(${paperTexture(11 + i, 40, 70, 196)}), url(${paperTexture(21 + i, 160, 280, 222)})`;
  });

  // particle emitters
  emit('puff', T.goodSlam + .1, { x0: 200, x1: 880, y: 1110, jy: 20, n: 26, rgb: '255,240,204', alpha: .24, size: [26, 50], grow: 160, spread: 420, rise: [20, 120], drag: 3.2, g: 140, life: [.7, 1.2], from: 0, to: T.holeGrow[1] });
  emit('puff', T.starLand, { x0: 450, x1: 630, y: 700, jy: 10, n: 18, rgb: '255,236,190', alpha: .3, size: [12, 26], grow: 80, spread: 140, rise: [40, 160], drag: 3.5, g: 120, life: [.6, 1], from: 0, to: T.holeGrow[1] });
  emit('puff', T.shot0, { x0: 530, x1: 550, y: HOLE.y, jy: 10, n: 22, rgb: '235,225,205', alpha: .5, size: [10, 22], grow: 110, spread: 120, rise: [80, 260], drag: 2.6, g: -60, life: [.6, 1.1], from: 0, to: T.holeGrow[1] });
  emit('puff', T.badSlam + .1, { x0: 260, x1: 820, y: 1190, jy: 20, n: 26, rgb: '50,6,6', alpha: .3, size: [26, 50], grow: 160, spread: 420, rise: [20, 120], drag: 3.2, g: 140, life: [.7, 1.2], from: T.holeGrow[0], to: T.cutC });
  holesB.forEach(h => emit('puff', h.t, { x0: h.fx - 6, x1: h.fx + 6, y: h.fy, jy: 6, n: 16, rgb: '232,222,204', alpha: .55, size: [8, 18], grow: 90, spread: 90, rise: [90, 240], drag: 2.4, g: -80, life: [.6, 1.1], from: T.holeGrow[0], to: T.cutC }));
  letters.forEach((s, i) => {
    const cx = 540 + odeyaW / 2 - (i + .5) * odeyaW / LETTERS.length;
    emit('puff', T.letters + i * T.letterGap + .16, { x0: cx - 50, x1: cx + 50, y: 1150, jy: 12, n: 10, rgb: '255,214,160', alpha: .3, size: [10, 22], grow: 70, spread: 110, rise: [30, 120], drag: 3.5, g: 80, life: [.5, .9], from: T.cutC, to: 99 });
  });
  emit('spark', T.lockHit, { x0: 530, x1: 550, y: 560, jy: 30, n: 46, rgb: '255,226,160', alpha: 1, speed: [500, 1500], drag: 4.5, g: 1600, life: [.3, .6], from: T.cutC, to: 99 });
  emit('puff', T.lockHit, { x0: 500, x1: 580, y: 570, jy: 20, n: 24, rgb: '255,214,160', alpha: .35, size: [14, 30], grow: 140, spread: 300, rise: [20, 160], drag: 3, g: 60, life: [.6, 1.1], from: T.cutC, to: 99 });
}

// ---------- per-frame ----------
function slam(el, t, t0, o = {}) {
  const from = o.from ?? 2.4, dur = o.dur ?? .17, blur = o.blur ?? 16;
  const d = t - t0;
  if (d < 0) { el.style.opacity = 0; return; }
  const p = clamp(d / dur);
  let s = lerp(from, 1, ease.outExpo(p));
  if (p >= 1) { const d2 = d - dur; s = 1 - .04 * Math.exp(-d2 * 12) * Math.sin(d2 * 38); }
  el.style.opacity = clamp(d / .03);
  el.style.transform = `scale(${s.toFixed(4)})`;
  const b = blur * (1 - ease.outCubic(p));
  el.style.filter = b > .3 ? `blur(${b.toFixed(1)}px)` : 'none';
}
function echo(el, t, t0) {
  const d = t - t0;
  if (d < 0 || d > .32) { el.style.opacity = 0; return; }
  const p = d / .32;
  el.style.opacity = (.85 * (1 - p)).toFixed(3);
  el.style.transform = `scale(${(1 + .32 * ease.outCubic(p)).toFixed(4)})`;
}
function spark(el, t, t0, dur, x, y, size) {
  const p = (t - t0) / dur;
  if (p < 0 || p > 1) { el.setAttribute('opacity', 0); return; }
  const s = Math.sin(Math.PI * p) * size;
  el.setAttribute('opacity', 1);
  el.setAttribute('transform', `translate(${x} ${y}) rotate(${(p * 90).toFixed(1)}) scale(${s.toFixed(3)})`);
}
function motionBlur(el, px) {
  const i = Math.min(14, Math.round(Math.abs(px) / 4));
  el.style.filter = i ? `url(#mb${i})` : 'none';
}

function renderA(t) {
  const on = t < T.holeGrow[1] + .02;
  $('sceneA').style.visibility = on ? 'visible' : 'hidden';
  if (!on) return;
  $('raysA').style.transform = `rotate(${(t * 9).toFixed(2)}deg)`;
  slam($('wGood'), t, T.goodSlam, { from: 2.6 });
  echo($('gGood'), t, T.goodSlam + .1);

  // rule draws out from the centre
  const rp = ease.outCubic(prog(t, T.rule[0], T.rule[1]));
  $('ruleWrap').style.transform = `translate(-50%, -50%) scaleX(${rp.toFixed(4)})`;
  $('ruleWrap').style.opacity = rp > 0 ? 1 : 0;

  // star drops, spins, lands; later takes the bullet
  if (t < T.starDrop) star.style.opacity = 0;
  else {
    let y, rot, sc = 1;
    if (t < T.starLand) {
      const p = prog(t, T.starDrop, T.starLand);
      y = lerp(-760, 0, ease.inQuad(p));
      rot = lerp(-320, 0, ease.outCubic(p));
    } else {
      const d = t - T.starLand;
      y = -24 * Math.abs(Math.sin(d * 16)) * Math.exp(-d * 9);
      rot = 9 * Math.exp(-d * 7) * Math.sin(d * 22);
    }
    if (t >= T.shot0) {
      const d = t - T.shot0;
      rot += 18 * Math.exp(-d * 6) * Math.sin(d * 30 + .5);
      sc *= 1 + .12 * Math.exp(-d * 14);
    }
    star.style.opacity = 1;
    star.style.transform = `translate(-50%, -50%) translateY(${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  }
  spark(sparkA, t, T.starGlint, .34, HOLE.x + 97, HOLE.y - 56, 1.1);

  if (t >= T.shot0) {
    const d = t - T.shot0;
    holeA.setAttribute('opacity', 1);
    holeA.setAttribute('transform', `translate(${HOLE.x} ${HOLE.y}) scale(${(1 + .5 * Math.exp(-d * 30)).toFixed(3)})`);
  } else holeA.setAttribute('opacity', 0);
}

function renderB(t) {
  const on = t >= T.shot0 && t < T.cutC;
  const sc = $('sceneB'), burn = $('burnSvg');
  sc.style.visibility = on ? 'visible' : 'hidden';
  burn.style.visibility = 'hidden';
  if (!on) return;
  if (t < T.holeGrow[0]) sc.style.clipPath = `circle(31px at ${HOLE.x}px ${HOLE.y}px)`;
  else if (t < T.holeGrow[1]) {
    // the bullet hole burns open like a film burn
    const d = ragPath(HOLE.x, HOLE.y, lerp(31, 2300, ease.inCubic(prog(t, ...T.holeGrow))));
    sc.style.clipPath = `path('${d}')`;
    $('burn').setAttribute('d', d);
    burn.style.visibility = 'visible';
  } else sc.style.clipPath = 'none';

  $('ringsB').style.transform = `scale(${(1 + (t - T.shot0) * .1).toFixed(4)})`;
  slam($('wBad'), t, T.badSlam, { from: 2.8, dur: .16, blur: 18 });
  echo($('gBad'), t, T.badSlam + .1);

  // shots: holes pop, the sign jolts, then swings on its last nail and drops
  let rot = 0, y = 0;
  holesB.forEach((h, i) => {
    const d = t - h.t;
    if (d < 0) { h.g.setAttribute('opacity', 0); return; }
    h.g.setAttribute('opacity', 1);
    h.g.setAttribute('transform', `translate(${h.x.toFixed(1)} ${h.y.toFixed(1)}) scale(${(1 + .7 * Math.exp(-d * 28)).toFixed(3)})`);
    rot += (i % 2 ? -1 : 1) * 3 * Math.exp(-d * 9) * Math.sin(d * 34);
  });
  if (t >= T.badSwing) {
    const d = t - T.badSwing;
    rot += -26 * (1 - Math.exp(-d * 7) * Math.cos(d * 15));
  }
  if (t >= T.badFall) {
    const p = prog(t, T.badFall, T.badFall + .3);
    y = 2300 * ease.inCubic(p);
    rot -= 50 * ease.inQuad(p);
  }
  $('badWrap').style.transform = `translate(-50%, -50%) translateY(${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
}

function renderC(t) {
  const on = t >= T.cutC;
  $('sceneC').style.visibility = on ? 'visible' : 'hidden';
  if (!on) return;
  const p = ease.outCubic(prog(t, ...T.sunRise));
  const cy = lerp(1900, 1080, p);
  $('sun').style.top = cy + 'px';
  $('sunGlow').style.top = cy + 'px';
  $('sunGlow').style.opacity = (.45 + .55 * p).toFixed(3);

  letters.forEach((el, i) => {
    const d = t - (T.letters + i * T.letterGap);
    if (d < 0) { el.style.opacity = 0; return; }
    const q = clamp(d / T.letterDur);
    const y = lerp(-560, 0, ease.outBounce(q));
    const rot = lerp(LROT[i], 0, ease.outCubic(clamp(d / (T.letterDur * .75))));
    el.style.opacity = clamp(d / .05);
    el.style.transform = `translateY(${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
  });
  spark(sparkC, t, T.odeyaGlint, .4, 540 + odeyaW / 2 - 70, 1010 - 120, 1.25);

  // "הטוב," and "הרע" crash into each other above the sun
  const lp = prog(t, T.lockIn, T.lockHit);
  const g = $('lkGood'), b = $('lkBad'), lock = $('lockWrap');
  if (t < T.lockIn) { g.style.opacity = 0; b.style.opacity = 0; }
  else {
    g.style.opacity = 1; b.style.opacity = 1;
    let off, vel;
    if (lp < 1) { off = 1000 * (1 - ease.inQuad(lp)); vel = 2000 * lp / (T.lockHit - T.lockIn) / FPS; }
    else { const d = t - T.lockHit; off = -16 * Math.exp(-d * 10) * Math.cos(d * 30); vel = 0; }
    g.style.transform = `translateX(${off.toFixed(1)}px)`;
    b.style.transform = `translateX(${(-off).toFixed(1)}px)`;
    motionBlur(g, vel * .9); motionBlur(b, vel * .9);
    const d = t - T.lockHit;
    const punch = d >= 0 ? 1 + .07 * Math.exp(-d * 11) : 1;
    lock.style.transform = `translate(-50%, -50%) scale(${punch.toFixed(4)})`;
  }
}

function renderCamera(t) {
  let x = 0, y = 0, r = 0, s = 1;
  for (const k of kicks) {
    const d = t - k.t;
    if (d < 0 || d > .7) continue;
    const e = k.a * Math.exp(-d * 9);
    x += e * Math.sin(d * 71 + k.t * 17);
    y += e * Math.sin(d * 89 + k.t * 29 + 1.3);
    r += e * .022 * Math.sin(d * 63 + k.t * 5);
    s += k.a / 26 * .03 * Math.exp(-d * 14);
  }
  if (t < T.shot0) s *= 1 + .035 * ease.inOutCubic(prog(t, T.goodSlam, T.shot0));
  else if (t < T.cutC) s *= 1 + .035 * ease.inOutCubic(prog(t, T.badSlam, T.cutC));
  else s *= 1 + .06 * ease.inOutCubic(prog(t, T.cutC, T.end));
  x += Math.sin(t * 5.3) * .9 + Math.sin(t * 13.1 + 2) * .5;   // gate weave
  y += Math.sin(t * 4.1 + 1) * 1.1 + Math.sin(t * 11.7) * .4;
  $('cam').style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
}

const partsCtx = $('parts').getContext('2d');
const grainCtx = $('grain').getContext('2d');
const dirtCtx = $('dirt').getContext('2d');

window.renderFrame = t => {
  const frame = Math.round(t * FPS);
  renderA(t); renderB(t); renderC(t);
  renderCamera(t);

  partsCtx.clearRect(0, 0, 1080, 1920);
  if (t >= T.cutC) drawSky(partsCtx, t);
  drawParticles(partsCtx, t);

  let fa = 0;
  for (const f of flashes) { const d = t - f.t; if (d >= 0 && d < f.d) fa = Math.max(fa, f.a * (1 - d / f.d)); }
  $('flash').style.opacity = fa.toFixed(3);
  $('flicker').style.opacity = (.015 + rng(frame * 13 + 5)() * .05).toFixed(3);

  const ip = prog(t, 0, T.iris);
  const iris = $('iris');
  if (ip >= 1) iris.style.display = 'none';
  else {
    const R = lerp(0, 1250, ease.outCubic(ip));
    iris.style.display = 'block';
    iris.style.background = `radial-gradient(circle at 540px 900px, rgba(0,0,0,0) ${R.toFixed(1)}px, #000 ${(R + 2).toFixed(1)}px)`;
  }
  drawGrain(grainCtx, frame);
  drawDirt(dirtCtx, frame);
};

(async () => {
  await Promise.all([
    document.fonts.load('400 100px "Suez One"', 'הטוב'),
    document.fonts.load('900 100px "Frank Ruhl Libre"', 'ועודיה'),
  ]);
  await document.fonts.ready;
  build();
  window.renderFrame(0);
  window.__ready = true;
})();
</script>
