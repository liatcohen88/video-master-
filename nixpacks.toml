# Nixpacks build config — adds Python 3.11 + ffmpeg + faster-whisper to the
# Node app so /api/transcribe can spawn the Python script we already wrote.
# Coolify auto-detects this file and runs the extra setup phase.

[phases.setup]
# `chromium` is added so Remotion can render React → MP4 via headless
# Chrome without downloading its own ~150MB Headless Shell on cold start.
# The remotionRender.ts helper picks it up via the CHROME_BIN env var.
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "ffmpeg-full", "zlib", "stdenv.cc.cc.lib", "chromium"]
aptPkgs = ["build-essential", "libsndfile1", "zlib1g"]

[phases.install]
cmds = [
  "npm ci --legacy-peer-deps",
  # Install faster-whisper into a venv so site-packages don't collide with
  # any system Python the host might have. /opt/whisper-venv is the canonical
  # path picked up by the transcribe route via PYTHON_PATH env var.
  "python3 -m venv /opt/whisper-venv",
  "/opt/whisper-venv/bin/pip install --upgrade pip",
  "/opt/whisper-venv/bin/pip install -r requirements.txt",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

# Tell the transcribe route which Python to spawn (the venv interpreter has
# faster-whisper installed; system python3 does not).
#
# DO NOT set LD_LIBRARY_PATH here — apt's glibc conflicts with Nix's glibc and
# Node itself dies with "__vdso_gettimeofday: invalid mode for dlopen()" during
# npm ci. The transcribe route discovers the correct Nix-store lib paths at
# runtime (see nixLibPath() in src/app/api/transcribe/route.ts) and injects
# them only into the Python child process, not the global Node environment.
[variables]
PYTHON_PATH = "/opt/whisper-venv/bin/python3"
# Tell Remotion which Chromium to use instead of downloading its own. The
# Nix-installed binary is symlinked via PATH; "chromium" resolves at runtime.
CHROME_BIN = "chromium"
