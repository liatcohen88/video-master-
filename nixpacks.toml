# Nixpacks build config — adds Python 3.11 + ffmpeg + faster-whisper to the
# Node app so /api/transcribe can spawn the Python script we already wrote.
# Coolify auto-detects this file and runs the extra setup phase.

[phases.setup]
# Chromium intentionally NOT in nixPkgs — adding it bloated the docker
# image past the disk envelope on CX23 (build #17 OOM'd at layer export).
# Remotion downloads its own Headless Shell on first render (~150MB to
# ~/.cache/remotion). Slower first cold-render, but the build fits.
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "ffmpeg-full", "zlib", "stdenv.cc.cc.lib"]
# Chromium runtime deps for Remotion's headless-shell. Remotion downloads
# its own binary (~150MB) on first render, but the binary dynamically
# links against the system NSS/ATK/GTK/X stack — these apt packages are
# what `ldd chrome-headless-shell` needs to satisfy. Without them the
# binary errors with "libnspr4.so: cannot open shared object file".
# Costs ~50MB image size — much less than installing chromium itself.
aptPkgs = [
  "build-essential", "libsndfile1", "zlib1g",
  "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0",
  "libcups2", "libdrm2", "libgbm1", "libxkbcommon0",
  "libxcomposite1", "libxdamage1", "libxrandr2", "libxfixes3",
  "libxshmfence1", "libpango-1.0-0", "libcairo2", "libasound2"
]

[phases.install]
cmds = [
  "npm ci --legacy-peer-deps",
  # Install faster-whisper into a venv so site-packages don't collide with
  # any system Python the host might have. /opt/whisper-venv is the canonical
  # path picked up by the transcribe route via PYTHON_PATH env var.
  "python3 -m venv /opt/whisper-venv",
  "/opt/whisper-venv/bin/pip install --upgrade pip",
  "/opt/whisper-venv/bin/pip install -r requirements.txt",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

# Tell the transcribe route which Python to spawn (the venv interpreter has
# faster-whisper installed; system python3 does not).
#
# DO NOT set LD_LIBRARY_PATH here — apt's glibc conflicts with Nix's glibc and
# Node itself dies with "__vdso_gettimeofday: invalid mode for dlopen()" during
# npm ci. The transcribe route discovers the correct Nix-store lib paths at
# runtime (see nixLibPath() in src/app/api/transcribe/route.ts) and injects
# them only into the Python child process, not the global Node environment.
[variables]
PYTHON_PATH = "/opt/whisper-venv/bin/python3"
# CHROME_BIN intentionally UNSET — chromium isn't in nixPkgs (it bloated
# the image past the CX23 disk envelope). With no CHROME_BIN, Remotion
# downloads its own Headless Shell on first render (~150MB to
# ~/.cache/remotion). First render is slow (~30s cold download), every
# render after that is fast — the binary stays cached for the container
# lifetime.
